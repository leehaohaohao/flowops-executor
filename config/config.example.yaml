# FlowOps Executor 外部配置示例
#
# 用法（二选一）：
#   ./flowops-executor --config /etc/flowops/executor.yaml
#   FLOWOPS_CONFIG=/etc/flowops/executor.yaml ./flowops-executor
#
# 只需写需要覆盖的字段：未写字段会继续按
#   外部 YAML > 内嵌 YAML
# 逐级 fallback（核心字段 id / master_addr / token / version 还会先看 CLI / ENV）。
#
# 建议：token 不落在配置文件里，改用 FLOWOPS_RUNNER_TOKEN 提供，
# 这样既避免明文落盘，也便于容器注入。

runner:
  id: runner-01
  master_addr: 10.0.0.10:9090
  version: 1.0.0
  # token 由环境变量提供：
  #   FLOWOPS_RUNNER_TOKEN=xxxxx ./flowops-executor --config /etc/flowops/executor.yaml

# 可选：非核心字段同样支持「外部 > 内嵌」覆盖（写成同样的 runner: 段即可）
#   heartbeat_interval: 10
#   connect_timeout: 5
#   reconnect_initial_interval: 1
#   reconnect_max_interval: 30
#   register_timeout: 10
#   auth_retry_interval: 60
